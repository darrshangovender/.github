name: Feature request
description: Propose an addition or change.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The smallest change that would solve it. Alternatives you considered are welcome.
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
